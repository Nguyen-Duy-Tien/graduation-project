{% extends "base.html" %}
{% block content %}
<h4>User info (vulnerable endpoint)</h4>
<form method="get">
  <div class="form-group">
    <label>id</label>
    <input name="id" class="form-control" value="{{ request.args.get('id','') }}">
  </div>
  <button class="btn btn-primary">Get user</button>
</form>

{% if raw %}
<hr>
<h6>Raw query</h6>
<pre>{{ raw }}</pre>
{% endif %}
{% if err %}
<div class="alert alert-danger mt-2">{{ err }}</div>
{% endif %}

{% if rows %}
<hr>
<h5>Rows</h5>
<pre>{{ rows }}</pre>
{% endif %}
{% endblock %}
